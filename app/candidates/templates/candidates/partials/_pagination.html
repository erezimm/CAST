<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <form method="GET"
          id="pagination-form"
          action="{% url 'candidates:list' %}"
          class="form-inline">

      <label for="items_per_page" class="mr-2">Items per page:</label>

      <select id="items_per_page"
              name="items_per_page"
              class="form-control form-control-sm"
              onchange="this.form.submit();">

        <option value="5"  {% if items_per_page|default:25 == 5 %}selected{% endif %}>5</option>
        <option value="10" {% if items_per_page|default:25 == 10 %}selected{% endif %}>10</option>
        <option value="25" {% if items_per_page|default:25 == 25 %}selected{% endif %}>25</option>
        <option value="50" {% if items_per_page|default:25 == 50 %}selected{% endif %}>50</option>
        <option value="100"{% if items_per_page|default:25 == 100 %}selected{% endif %}>100</option>
      </select>
    </form>
  </div>

  <nav aria-label="Page navigation">
    <ul class="pagination mb-0">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.previous_page_number }}&{{ query_without_page }}"
             aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
      {% endif %}

      {% for num in page_obj.paginator.page_range %}
        <li class="page-item {% if page_obj.number == num %}active{% endif %}">
          <a class="page-link"
             href="?page={{ num }}&{{ query_without_page }}">
            {{ num }}
          </a>
        </li>
      {% endfor %}

      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.next_page_number }}&{{ query_without_page }}"
             aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>
</div>
