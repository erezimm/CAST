<form method="GET"
      id="filter-form"
      action="{% url 'candidates:list' %}"
      class="mb-4">

  <div class="form-row">
    <div class="col-md-2">
      <label for="start_datetime">Start Date:</label>
      <input type="datetime-local"
             id="start_datetime"
             name="start_datetime"
             class="form-control"
             value="{{ start_datetime|date:'Y-m-d\\TH:i' }}">
    </div>

    <div class="col-md-2">
      <label for="end_datetime">End Date:</label>
      <input type="datetime-local"
             id="end_datetime"
             name="end_datetime"
             class="form-control"
             value="{{ end_datetime }}">
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-primary">Filter</button>
    </div>
  </div>

  <div class="form-group mt-3">
    <label for="filter">Filters:</label>
    <select id="filter"
            name="filter"
            class="col-md-2 form-control form-control-sm"
            onchange="this.form.submit();">
      <option value="all" {% if filter_value == 'all' %}selected{% endif %}>All</option>
      <option value="neither" {% if filter_value == 'neither' %}selected{% endif %}>New</option>
      <option value="tns_not_reported" {% if filter_value == 'tns_not_reported' %}selected{% endif %}>
        Not reported to TNS
      </option>
      <option value="tns_reported" {% if filter_value == 'tns_reported' %}selected{% endif %}>
        Reported to TNS
      </option>
      <option value="real" {% if filter_value == 'real' %}selected{% endif %}>Real</option>
      <option value="bogus" {% if filter_value == 'bogus' %}selected{% endif %}>Bogus</option>
      <option value="followup" {% if filter_value == 'followup' %}selected{% endif %}>
        Marked for follow-up
      </option>
    </select>

    <p class="mb-0 mt-2">
      <b>Number of Candidates Found:</b> {{ candidate_count }}
    </p>
  </div>

  <div class="form-row mt-2">
    <div class="col-md-1">
      <label for="max_distance">Max Distance (Mpc):</label>
      <input type="number"
             step="any"
             id="max_distance"
             name="max_distance"
             class="form-control"
             value="{{ max_distance }}">
    </div>

    <div class="col-md-1">
      <label for="fieldid_filter">Field ID:</label>
      <input type="number"
             id="fieldid_filter"
             name="fieldid_filter"
             class="form-control"
             value="{{ fieldid_filter }}">
    </div>

    <div class="col-md-2">
      <label for="ToO_filter">ToO Name:</label>
      <input type="text"
             id="ToO_filter"
             name="ToO_filter"
             class="form-control"
             list="too-options"
             value="{{ ToO_filter }}"
             onchange="this.form.submit();">

      <datalist id="too-options">
        {% for item in page_obj.object_list %}
          {% if item.candidate.ToO_name %}
            <option value="{{ item.candidate.ToO_name }}">
          {% endif %}
        {% endfor %}
      </datalist>
    </div>

    <div class="col-md-2">
      <label for="discovery_date">Discovery Date After:</label>
      <input type="datetime-local"
             id="discovery_date"
             name="discovery_date"
             class="form-control"
             value="{{ discovery_date }}">
    </div>
  </div>
</form>
