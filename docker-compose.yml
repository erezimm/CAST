services:
  download-large-files:
    build: ./app
    command:
      - uv
      - run
      - python
      - scripts/download_large_files.py
      - --manifest
      - ${LARGE_FILES_MANIFEST_PATH:-/app/large_files_manifest.json}
    volumes:
      - ./app/:/app/
      - ./large_files_manifest.json:/app/large_files_manifest.json:ro
    env_file:
      - .env
    restart: "no"

  web:
    build: ./app
    container_name: cast-web
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app/:/app/
      - ./app/large_files:/app/large_files
      - static_data:/app/static
      - media_data:/app/data
      - /mnt/euclid/last/data/transients:/transients:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      collect-static:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: cast-scheduler
    depends_on:
      web:
        condition: service_healthy
    command: daemon --docker
    volumes:
      # Allows Ofelia to talk to the Docker engine to trigger commands
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Asia/Jerusalem
    healthcheck:
      test: ["CMD-SHELL", "ps -o comm= 1 | grep -q '^ofelia$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      ofelia.job-exec.ingest.schedule: "0 0 7 * * *"
      ofelia.job-exec.ingest.container: "cast-web"
      ofelia.job-exec.ingest.command: "uv run manage.py ingest_candidates --cutoff 1"

  redis:
    image: redis:8.4
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${DB_USER} -d ${DB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./app
    entrypoint: uv run manage.py migrate
    volumes:
      - ./app/:/app/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"  # Run once and exit

  collect-static:
    build: ./app
    command: uv run manage.py collectstatic --noinput
    volumes:
      - ./app/:/app/
      - static_data:/app/static
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  media_data:
  static_data:
